      - $ref: '#/components/parameters/IdPath'
    get:
      x-draft: true
      tags:
        - Persetujuan Izin & Notifikasi (F07)
      summary: Detail pengajuan + dampak bila disetujui (W40)
      responses:
        '200':
          description: Detail pengajuan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveApprovalDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /leave-requests/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      x-draft: true
      tags:
        - Persetujuan Izin & Notifikasi (F07)
      summary: Setujui pengajuan (W40, W41 · FR-14, FR-16)
      description: |
        Dalam satu transaksi: status jadi `disetujui`, kuota cuti dipotong, hari kerja di rentang tanggal
        ditulis ke kehadiran dengan status sesuai jenis (cuti/izin/sakit/wfh) dan `leave_request_id`
        (FR-16, tidak dihitung alpha), lalu notifikasi `leave_approved` dikirim ke karyawan (FR-15).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveLeaveRequest'
      responses:
        '200':
          description: Pengajuan disetujui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveApprovalDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Bukan atasan yang berwenang, atau menyetujui pengajuan sendiri
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          description: Kuota cuti tidak cukup lagi (`LEAVE_QUOTA_EXCEEDED`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /leave-requests/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      x-draft: true
      tags:
        - Persetujuan Izin & Notifikasi (F07)
      summary: Tolak pengajuan dengan alasan wajib (W04, W42, W45, W43 · FR-14)
      description: Kuota tidak berubah. Alasan dikirim ke karyawan lewat notifikasi `leave_rejected`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Pengajuan ditolak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveApprovalDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/notifications:
    get:
      x-draft: true
      tags:
        - Persetujuan Izin & Notifikasi (F07)
      summary: Notifikasi pengguna, terbaru dulu (M20, KW25 · FR-15, FR-20)
      parameters:
        - name: unread
          in: query
