    get:
      tags:
        - Riwayat & Rekapitulasi (F05)
      summary: Cek status pembuatan dan tautan unduhan dokumen PDF (W39, W98)
      responses:
        '200':
          description: Status ekspor PDF dan URL unduhan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JSON Web Token yang memuat klaim:
        - `sub`: User ID
        - `tid`: Tenant ID
        - `role`: Peran pengguna (`super_admin`, `owner`, `hrd`, `team_lead`, `employee`, `cashier`)
        - `eid`: Employee ID
        - `mods`: Modul aktif tenant, misalnya `["attendance", "leave", "payroll"]`

  responses:
    UnauthorizedError:
      description: Autentikasi gagal atau token tidak disertakan
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ForbiddenError:
      description: Tidak memiliki hak akses untuk tindakan ini
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFoundError:
      description: Data tidak ditemukan pada tenant ini
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationError:
      description: Data input tidak valid (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ConflictError:
      description: Konflik status, misalnya sudah clock-in hari ini atau pengajuan sudah diputuskan
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequestsError:
      description: Terlalu banyak permintaan; tunggu sesuai header Retry-After
      headers:
        Retry-After:
          description: Detik sebelum boleh mencoba lagi
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  parameters:
    PageQuery:
      name: page
      in: query
      description: Nomor halaman, mulai dari 1
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageQuery:
      name: per_page
      in: query
      description: Jumlah item per halaman (maks. 100)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    MonthQuery:
      name: month
      in: query
      description: Bulan dalam format YYYY-MM; default bulan berjalan di zona waktu tenant
      required: false
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        example: '2026-09'
    DepartmentQuery:
      name: department_id
      in: query
      description: Filter divisi/departemen; kosong = semua divisi
      required: false
      schema:
        type: string

  schemas:
    # ------------------------------------------
    # RFC 7807 PROBLEM DETAILS
    # ------------------------------------------
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          example: https://ontrack.app/problems/validation-error
        title:
          type: string
          example: Data yang dimasukkan tidak valid
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: Format email atau field wajib belum diisi dengan benar.
        code:
          type: string
          example: VALIDATION_ERROR
        errors:
          type: object
          additionalProperties:
            type: string
          example:
            email: Format email tidak valid
            name: Nama wajib diisi

    PaginationMeta:
      type: object
      required:
        - page
        - per_page
        - total
        - total_pages
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 6
        total_pages:
          type: integer
          example: 1

    # ------------------------------------------
    # AUTH SCHEMAS
    # ------------------------------------------
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: daze@studiotigapagi.com
        password:
          type: string
          format: password
          example: Demo1234
        remember_me:
          type: boolean
          default: false

    AuthTokens:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          example: eyJhbGciOi...
        refresh_token:
          type: string
          example: def502...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Masa berlaku access token dalam detik (900 detik / 15 menit)
          example: 900

    LoginResponse:
      type: object
      required:
        - tokens
        - user
      properties:
        tokens:
          $ref: '#/components/schemas/AuthTokens'
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      required:
        - id
        - tenant_id
        - name
        - email
        - role
      properties:
        id:
          type: string
          example: daze
        tenant_id:
          type: string
          example: tenant-studiotigapagi
        name:
          type: string
          example: Dhais Alfa Rysy
        email:
          type: string
          example: daze@studiotigapagi.com
        role:
          type: string
          enum: [super_admin, owner, hrd, team_lead, employee, cashier]
          example: employee
        department:
          type: string
          example: Design
        position:
          type: string
          example: Lead Graphic Designer

    # ------------------------------------------
    # DEPARTMENTS SCHEMAS
    # ------------------------------------------
    Department:
      type: object
      required:
        - id
        - tenant_id
        - name
        - created_at
      properties:
        id:
          type: string
          example: dept-design
        tenant_id:
          type: string
          example: tenant-studiotigapagi
        name:
          type: string
          example: Design
        description:
          type: string
          nullable: true
          example: Divisi desain grafis, produk, dan UI/UX
        employee_count:
          type: integer
          example: 3
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateDepartmentRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Marketing
        description:
          type: string
          maxLength: 255
          example: Tim pemasaran dan media sosial

    UpdateDepartmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 255

    # ------------------------------------------
    # POSITIONS SCHEMAS
    # ------------------------------------------
    Position:
      type: object
      required:
        - id
        - tenant_id
        - name
        - created_at
      properties:
        id:
          type: string
          example: pos-lead-designer
        tenant_id:
          type: string
          example: tenant-studiotigapagi
        department_id:
          type: string
          nullable: true
          example: dept-design
        department_name:
          type: string
          nullable: true
          example: Design
        name:
          type: string
          example: Lead Graphic Designer
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePositionRequest:
      type: object
      required:
        - name
      properties:
        department_id:
          type: string
          nullable: true
          example: dept-design
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Senior UI Designer
        description:
          type: string
          maxLength: 255

    UpdatePositionRequest:
      type: object
      properties:
        department_id:
          type: string
          nullable: true
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 255

    # ------------------------------------------
    # USERS / EMPLOYEES SCHEMAS (FR-03)
    # ------------------------------------------
    UserResponse:
      type: object
      required:
        - id
        - tenant_id
        - name
        - email
        - role
        - employment_type
        - status
        - created_at
      properties:
        id:
          type: string
          example: daze
        tenant_id:
          type: string
          example: tenant-studiotigapagi
        name:
          type: string
          example: Dhais Alfa Rysy
        email:
          type: string
          example: daze@studiotigapagi.com
        phone:
          type: string
          nullable: true
          example: 0857 3900 1122
        department_id:
          type: string
          nullable: true
          example: dept-design
        department_name:
          type: string
          nullable: true
          example: Design
        position_id:
          type: string
          nullable: true
          example: pos-lead-designer
        position_name:
          type: string
          nullable: true
          example: Lead Graphic Designer
        role:
          type: string
          enum: [owner, hrd, team_lead, employee, cashier]
          example: employee
        employment_type:
          type: string
          enum: [tetap, kontrak, magang]
          example: tetap
        status:
          type: string
          enum: [aktif, nonaktif, diundang]
          example: aktif
        joined_at:
          type: string
          format: date
          example: "2024-03-12"
        manager_id:
          type: string
          nullable: true
          example: ananda
        manager_name:
          type: string
          nullable: true
          example: Ananda Sartana
        schedule_id:
          type: string
          nullable: true
          example: sched-reguler
        schedule_name:
          type: string
          nullable: true
          example: Reguler · 09.00–17.00
        location_id:
          type: string
          nullable: true
          example: loc-sanur
        location_name:
          type: string
          nullable: true
          example: Kantor Sanur
        allow_wfh_without_approval:
          type: boolean
          default: false
          example: false
        # SENSITIVE DATA (HANYA MUNCUL UNTUK OWNER & HRD):
        base_salary:
          type: string
          nullable: true
          description: Gaji pokok berupa string desimal (Hanya terlihat oleh Owner & HRD).
          example: "7250000.00"
        bank_name:
          type: string
          nullable: true
          description: Nama bank (Hanya terlihat oleh Owner & HRD).
          example: BCA
        bank_account_number:
          type: string
          nullable: true
          description: Nomor rekening bank (Hanya terlihat oleh Owner & HRD).
          example: "0123454821"
        bank_account_holder:
          type: string
          nullable: true
          description: Nama pemilik rekening (Hanya terlihat oleh Owner & HRD).
          example: Dhais Alfa Rysy
        # DATA PENONAKTIFAN:
        inactive_since:
          type: string
          format: date
          nullable: true
          example: "2026-10-01"
        deactivation_reason:
          type: string
          nullable: true
          maxLength: 200
          example: Mengundurkan diri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required:
        - name
        - email
        - role
        - employment_type
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Putu Ayu Lestari
        email:
          type: string
          format: email
          example: ayu@studiotigapagi.com
        phone:
          type: string
          example: 0812 3456 7890
        department_id:
          type: string
          example: dept-design
        position_id:
          type: string
          example: pos-ui-designer
        role:
          type: string
          enum: [owner, hrd, team_lead, employee, cashier]
          default: employee
        employment_type:
          type: string
          enum: [tetap, kontrak, magang]
          default: kontrak
        status:
          type: string
          enum: [aktif, diundang]
          default: diundang
        joined_at:
          type: string
          format: date
          example: "2026-11-01"
        manager_id:
          type: string
          example: daze
        schedule_id:
          type: string
          example: sched-reguler
        location_id:
          type: string
          example: loc-sanur
        allow_wfh_without_approval:
          type: boolean
          default: false
        base_salary:
          type: string
          pattern: '^\d+(\.\d{2})?$'
          example: "6500000.00"
        bank_name:
          type: string
          example: BCA
        bank_account_number:
          type: string
          example: "0987654321"
        bank_account_holder:
          type: string
          example: Putu Ayu Lestari

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
        department_id:
          type: string
          nullable: true
        position_id:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, hrd, team_lead, employee, cashier]
        employment_type:
          type: string
          enum: [tetap, kontrak, magang]
        joined_at:
          type: string
          format: date
        manager_id:
          type: string
          nullable: true
        schedule_id:
          type: string
          nullable: true
        location_id:
          type: string
          nullable: true
        allow_wfh_without_approval:
          type: boolean
        base_salary:
          type: string
          pattern: '^\d+(\.\d{2})?$'
        bank_name:
          type: string
        bank_account_number:
          type: string
        bank_account_holder:
          type: string

    DeactivateUserRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 200
          description: Alasan wajib penonaktifan karyawan (maks. 200 karakter)
          example: Masa kontrak berakhir dan tidak diperpanjang.

    # ------------------------------------------
    # AUTH & PERAN (F01)
    # ------------------------------------------
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: daze@studiotigapagi.com

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: Token dari tautan email
        password:
          type: string
          format: password
          minLength: 8
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$'
          description: Minimal 8 karakter, huruf dan angka, minimal satu huruf besar

    TenantRole:
      type: string
      description: Peran yang diatur per tenant (W18). `super_admin` tidak termasuk.
      enum: [owner, hrd, team_lead, employee, cashier]

    PermissionFeature:
      type: string
      description: Kunci fitur matriks W18, urut sesuai tampilan.
      enum:
        - employees.manage
        - attendance.self
        - leave.request
        - leave.approve
        - task.assign
        - task.update
        - payroll.manage
        - payslip.self
        - pos.transaction
        - inventory.manage

    RolePermissions:
      type: object
      required: [features]
      properties:
        features:
          type: array
          items:
            type: object
            required: [key, allowed]
            properties:
              key:
                $ref: '#/components/schemas/PermissionFeature'
              label:
                type: string
                readOnly: true
                example: Kelola karyawan & pengaturan
              allowed:
                type: array
                description: Peran yang boleh memakai fitur ini
                items:
                  $ref: '#/components/schemas/TenantRole'
                example: [owner, hrd]
        updated_at:
          type: string
          format: date-time
          readOnly: true

    UserSettings:
      type: object
      properties:
        push_notifications:
          type: boolean
          example: true

    RegisterDeviceRequest:
      type: object
      required: [push_token, platform]
      properties:
        push_token:
          type: string
          description: Expo push token
          example: ExponentPushToken[xxxxxxxxxxxxxxxx]
        platform:
          type: string
          enum: [ios, android]
        model:
          type: string
          example: iPhone 15 Pro
        os_version:
          type: string
          example: iOS 17.4

    # ------------------------------------------
    # JADWAL & LOKASI (F02)
    # ------------------------------------------
    WorkDay:
      type: string
      enum: [sen, sel, rab, kam, jum, sab, min]

    Schedule:
      type: object
      required:
        - id
        - name
        - start_time
        - end_time
        - tolerance_minutes
        - working_days
        - overtime_after_minutes
        - max_overtime_minutes
        - allow_remote
      properties:
        id:
          type: string
          example: reguler
        name:
          type: string
          example: Reguler
        start_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '09:00'
        end_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '17:00'
        tolerance_minutes:
          type: integer
          example: 10
        working_days:
          type: array
          items:
            $ref: '#/components/schemas/WorkDay'
          example: [sen, sel, rab, kam, jum]
        overtime_after_minutes:
          type: integer
          example: 30
        max_overtime_minutes:
          type: integer
          example: 180
        allow_remote:
          type: boolean
          example: true
        member_count:
          type: integer
          readOnly: true
          example: 8

    CreateScheduleRequest:
      type: object
      required: [name, start_time, end_time, working_days]
      properties:
        name:
          type: string
          example: Reguler
        start_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '09:00'
        end_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '17:00'
        tolerance_minutes:
          type: integer
          minimum: 0
          default: 10
        working_days:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkDay'
          example: [sen, sel, rab, kam, jum]
        overtime_after_minutes:
          type: integer
          minimum: 0
          default: 30
        max_overtime_minutes:
          type: integer
          minimum: 0
          default: 180
        allow_remote:
          type: boolean
          default: true

    UpdateScheduleRequest:
      type: object
      properties:
        name:
          type: string
        start_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        end_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        tolerance_minutes:
          type: integer
          minimum: 0
        working_days:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkDay'
        overtime_after_minutes:
          type: integer
          minimum: 0
        max_overtime_minutes:
          type: integer
          minimum: 0
        allow_remote:
          type: boolean

    Location:
      type: object
      required: [id, name, address, latitude, longitude, radius_meters, selfie_required]
      properties:
        id:
          type: string
          example: sanur
        name:
          type: string
          example: Kantor Sanur
        address:
          type: string
          example: Jl. Danau Tamblingan No. 226, Sanur
        latitude:
          type: number
          format: double
          example: -8.6923
        longitude:
          type: number
          format: double
          example: 115.2621
        radius_meters:
          type: integer
          minimum: 25
          maximum: 500
          example: 100
        selfie_required:
          type: boolean
          example: true
        member_count:
          type: integer
          readOnly: true
          example: 16

    CreateLocationRequest:
      type: object
      required: [name, address, latitude, longitude, radius_meters]
      properties:
        name:
          type: string
          example: Kantor Sanur
        address:
          type: string
          example: Jl. Danau Tamblingan No. 226, Sanur
        latitude:
          type: number
          format: double
          example: -8.6923
        longitude:
          type: number
          format: double
          example: 115.2621
        radius_meters:
          type: integer
          minimum: 25
          maximum: 500
          example: 100
        selfie_required:
          type: boolean
          default: true

    UpdateLocationRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        radius_meters:
          type: integer
          minimum: 25
          maximum: 500
        selfie_required:
          type: boolean

    ScheduleLocation:
      type: object
      required: [schedule, location, timezone, wfh_without_approval]
      properties:
        schedule:
          $ref: '#/components/schemas/Schedule'
        location:
          $ref: '#/components/schemas/Location'
        timezone:
          type: string
          description: Zona waktu IANA tenant
          example: Asia/Makassar
        wfh_without_approval:
          type: boolean
          description: Bila true, clock-in tidak dicek radius
          example: false

    # ------------------------------------------
    # ABSENSI HARIAN (F03, F04)
    # ------------------------------------------
    EmployeeRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: daze
        name:
          type: string
          example: Dhais Alfa Rysy
        initials:
          type: string
          example: DA
        position:
          type: string
          example: Lead Graphic Designer
        department_id:
          type: string
          example: design
        department_name:
          type: string
          example: Design

    ClockInStatus:
      type: string
      enum: [hadir, terlambat]

    ClockInRequest:
      type: object
      required: [latitude, longitude, accuracy_m]
      properties:
        latitude:
          type: number
          format: double
          example: -8.6923
        longitude:
          type: number
          format: double
          example: 115.2621
        accuracy_m:
          type: number
          example: 15.4
        device:
          type: string
          description: Model dan OS perangkat
          example: iPhone 15 Pro, iOS 17.4
        is_mock_location:
          type: boolean
          default: false
        selfie:
          type: string
          format: binary
          description: Foto JPEG. Wajib bila lokasi kantor `selfie_required`.

    ClockInResult:
      type: object
      required: [attendance_id, status, late_minutes, clocked_in_at, distance_m, accuracy_m, location_name]
      properties:
        attendance_id:
          type: string
        status:
          $ref: '#/components/schemas/ClockInStatus'
        late_minutes:
          type: integer
          description: 0 bila hadir tepat waktu
          example: 0
        clocked_in_at:
          type: string
          format: date-time
          example: '2026-10-01T00:52:00Z'
        distance_m:
          type: number
          example: 42
        accuracy_m:
          type: number
          example: 8
        location_name:
          type: string
          example: Kantor Sanur
        selfie_url:
          type: string
          format: uri
          nullable: true
          description: URL bertanda tangan, berlaku singkat

    ClockOutRequest:
      type: object
      required: [latitude, longitude, accuracy_m]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        accuracy_m:
          type: number
        is_mock_location:
          type: boolean
          default: false
        early_leave_note:
          type: string
          maxLength: 200
          description: Wajib bila clock-out sebelum jam pulang jadwal

    ClockOutResult:
      type: object
      required: [clocked_out_at, worked_minutes, early_minutes, overtime_minutes, distance_m, accuracy_m]
      properties:
        clocked_out_at:
          type: string
          format: date-time
          example: '2026-10-01T09:44:00Z'
        worked_minutes:
          type: integer
          example: 532
        early_minutes:
          type: integer
          description: 0 bila tidak pulang cepat
          example: 0
        overtime_minutes:
          type: integer
          description: 0 bila tidak ada lembur
          example: 44
        overtime_request_id:
          type: string
          nullable: true
          description: Terisi bila pengajuan lembur dibuat
        distance_m:
          type: number
          example: 40
        accuracy_m:
          type: number
          example: 20

    GeofenceProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            code:
              type: string
              enum:
                - GPS_WEAK
                - OUTSIDE_GEOFENCE
                - MOCK_LOCATION_DETECTED
                - FACE_NOT_DETECTED
                - SELFIE_REQUIRED
                - EARLY_LEAVE_NOTE_REQUIRED
                - NOT_CLOCKED_IN
            distance_m:
              type: number
              example: 1200
            radius_m:
              type: integer
              example: 100
            accuracy_m:
              type: number
              example: 120
            required_accuracy_m:
              type: integer
              example: 50

    MonthSummary:
      type: object
      required: [hadir, terlambat, izin, sakit, wfh, alpha, worked_minutes]
      properties:
        hadir:
          type: integer
          example: 19
        terlambat:
          type: integer
          example: 2
        izin:
          type: integer
          example: 1
        sakit:
          type: integer
          example: 0
        wfh:
          type: integer
          example: 0
        alpha:
          type: integer
          example: 0
        worked_minutes:
          type: integer
          example: 10342

    AttendanceToday:
      type: object
      required: [date, timezone, state, is_working_day, schedule, location, month_summary]
      properties:
        date:
          type: string
          format: date
          description: Tanggal hari ini di zona waktu tenant
          example: '2026-10-01'
        timezone:
          type: string
          example: Asia/Makassar
        state:
          type: string
          enum: [not_clocked_in, clocked_in, clocked_out]
        is_working_day:
          type: boolean
          description: false untuk akhir pekan jadwal atau hari libur tenant
        holiday_name:
          type: string
          nullable: true
        schedule:
          $ref: '#/components/schemas/Schedule'
        location:
          $ref: '#/components/schemas/Location'
        clock_in:
          type: object
          allOf:
            - $ref: '#/components/schemas/ClockInResult'
          nullable: true
        clock_out:
          type: object
          allOf:
            - $ref: '#/components/schemas/ClockOutResult'
          nullable: true
        month_summary:
          $ref: '#/components/schemas/MonthSummary'
        leave_remaining_days:
          type: number
          example: 9

    # ------------------------------------------
    # LEMBUR (F04)
    # ------------------------------------------
    DecisionStatus:
      type: string
      enum: [menunggu, disetujui, ditolak]

    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          example: Pekerjaan bisa dilanjutkan besok pagi.

    OvertimeRequest:
      type: object
      required: [id, employee, date, schedule_end, clock_out, minutes, status]
      properties:
        id:
          type: string
          example: daze-0110
        employee:
          $ref: '#/components/schemas/EmployeeRef'
        date:
          type: string
          format: date
          example: '2026-10-01'
        schedule_end:
          type: string
          example: '17:00'
        clock_in:
          type: string
          nullable: true
          example: '08:52'
        clock_out:
          type: string
          example: '17:44'
        minutes:
          type: integer
          example: 44
        distance_m:
          type: number
          nullable: true
          example: 40
        status:
          $ref: '#/components/schemas/DecisionStatus'
        reject_reason:
          type: string
          nullable: true

    OvertimeRequestDetail:
      allOf:
        - $ref: '#/components/schemas/OvertimeRequest'
        - type: object
          required: [history]
          properties:
            history:
              type: array
              description: Riwayat keputusan, terlama di atas (W94)
              items:
                type: object
                required: [at, text]
                properties:
                  at:
                    type: string
                    format: date-time
                  text:
                    type: string
                    example: Disetujui oleh I Komang Agus S.

    OvertimeRequestList:
      type: object
      required: [data, meta, counts]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OvertimeRequest'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        counts:
          type: object
          description: Jumlah per tab status, mengikuti filter divisi dan tanggal
          required: [menunggu, disetujui, ditolak]
          properties:
            menunggu:
              type: integer
              example: 3
            disetujui:
              type: integer
              example: 5
            ditolak:
              type: integer
              example: 1

    # ------------------------------------------
    # IZIN & CUTI (F06)
    # ------------------------------------------
    LeaveType:
      type: string
      description: |
        `wfh` sudah ada di riwayat contoh tetapi belum bisa diajukan lewat formulir F06
        (menunggu keputusan WFH / Dinas Luar).
      enum: [cuti, izin, sakit, wfh]

    LeaveQuota:
      type: object
      required: [year, total_days, used_days, pending_days, remaining_days, resets_on]
      properties:
        year:
          type: integer
          example: 2026
        total_days:
          type: number
          example: 12
        used_days:
          type: number
          example: 3
        pending_days:
          type: number
          example: 0
        remaining_days:
          type: number
          description: total − terpakai − menunggu
          example: 9
        resets_on:
          type: string
          format: date
          example: '2027-01-01'

    LeaveAttachment:
      type: object
      required: [name, size_bytes, content_type]
      properties:
        name:
          type: string
          example: surat-dokter-13okt.jpg
        size_bytes:
          type: integer
          example: 1258291
        content_type:
          type: string
          enum: [application/pdf, image/jpeg]
        url:
          type: string
          format: uri
          description: URL bertanda tangan, berlaku singkat

    LeaveRequest:
      type: object
      required: [id, type, start_date, end_date, days, reason, status, approver, created_at]
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/LeaveType'
        start_date:
          type: string
          format: date
          example: '2026-10-06'
        end_date:
          type: string
          format: date
          example: '2026-10-08'
        days:
          type: number
          multipleOf: 0.5
          description: Hari kerja; 0,5 untuk setengah hari
          example: 3
        reason:
          type: string
          maxLength: 200
          example: Acara keluarga di Singaraja.
        status:
          $ref: '#/components/schemas/DecisionStatus'
        attachment:
          type: object
          allOf:
            - $ref: '#/components/schemas/LeaveAttachment'
          nullable: true
        approver:
          type: object
          required: [name, role]
          properties:
            name:
              type: string
              example: I Komang Agus S.
            role:
              type: string
              example: Team Lead
        reject_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true
        decided_by:
          type: string
          nullable: true
          x-draft: true
          example: I Komang Agus S.
        decision_note:
          type: string
          nullable: true
          x-draft: true
          description: DRAF F07 - catatan atasan saat menyetujui (M42 "Catatan atasan")
        history:
          type: array
          x-draft: true
          description: DRAF F07 - riwayat status (M17, M42, M43)
          items:
            $ref: '#/components/schemas/LeaveHistoryEvent'

    CreateLeaveRequest:
      type: object
      required: [type, start_date, end_date, reason]
      properties:
        type:
          type: string
          enum: [cuti, izin, sakit]
        start_date:
          type: string
          format: date
          example: '2026-10-06'
        end_date:
          type: string
          format: date
          example: '2026-10-08'
        reason:
          type: string
          minLength: 1
          maxLength: 200
          example: Acara keluarga di Singaraja.
        attachment:
          type: string
          format: binary
          description: PDF atau JPG, maks. 5 MB. Wajib untuk sakit lebih dari 1 hari kerja.

    LeavePreviewRequest:
      type: object
      required: [type, start_date, end_date]
      properties:
        type:
          type: string
          enum: [cuti, izin, sakit]
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

    LeavePreview:
      type: object
      required: [days, remaining_days, exceeds_quota, doctor_note_required]
      properties:
        days:
          type: number
          description: Hari kerja setelah dikurangi akhir pekan dan libur tenant
          example: 3
        remaining_days:
          type: number
          example: 2
        exceeds_quota:
          type: boolean
          description: Hanya true untuk jenis cuti
          example: true
        doctor_note_required:
          type: boolean
          example: false
        holidays:
          type: array
          description: Hari libur di dalam rentang yang tidak dihitung
          items:
            type: object
            required: [date, name]
            properties:
              date:
                type: string
                format: date
              name:
                type: string

    # ------------------------------------------
    # RIWAYAT & REKAP (F05)
    # ------------------------------------------
    DayStatus:
      type: string
      enum: [hadir, terlambat, izin, cuti, sakit, wfh, alpha, libur]
