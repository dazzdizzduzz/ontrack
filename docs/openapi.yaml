        employee:
          $ref: '#/components/schemas/EmployeeRef'
        hadir:
          type: integer
          example: 19
        terlambat:
          type: integer
          example: 2
        izin:
          type: integer
          description: Izin, cuti, dan sakit
          example: 1
        alpha:
          type: integer
          example: 0
        worked_minutes:
          type: integer
          example: 10342
        today_status:
          $ref: '#/components/schemas/TodayStatus'

    AttendanceRecapStats:
      type: object
      required:
        - attendance_rate_percent
        - late_count
        - late_minutes_total
        - leave_count
        - leave_breakdown
        - alpha_count
      properties:
        attendance_rate_percent:
          type: number
          example: 94
        attendance_rate_change_percent:
          type: number
          nullable: true
          description: Selisih dengan bulan sebelumnya
          example: 2
        late_count:
          type: integer
          example: 6
        late_minutes_total:
          type: integer
          example: 74
        leave_count:
          type: integer
          example: 4
        leave_breakdown:
          type: object
          required: [cuti, izin, sakit]
          properties:
            cuti:
              type: integer
              example: 3
            izin:
              type: integer
              example: 0
            sakit:
              type: integer
              example: 1
        alpha_count:
          type: integer
          example: 1

    AttendanceRecap:
      type: object
      required: [month, data, meta, stats, employee_count]
      properties:
        month:
          type: string
          example: '2026-09'
        employee_count:
          type: integer
          example: 16
        data:
          type: array
          items:
