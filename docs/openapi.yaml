        worked_minutes:
          type: integer
          example: 487
        overtime_minutes:
          type: integer
          example: 0
        in_distance_m:
          type: number
          nullable: true
        in_accuracy_m:
          type: number
          nullable: true
        out_distance_m:
          type: number
          nullable: true
        out_accuracy_m:
          type: number
          nullable: true
        leave_request_id:
          type: string
          nullable: true
          x-draft: true
          description: DRAF F07 - terisi bila hari ini ditulis otomatis dari pengajuan yang disetujui (W44, FR-16)

    AttendanceDayDetail:
      allOf:
        - $ref: '#/components/schemas/AttendanceDay'
