openapi: 3.0.3
info:
  title: On-Track API - Fase 1 (Manajemen SDM & Struktur Organisasi)
  description: |
    Spesifikasi API Fase 1 untuk On-Track: Autentikasi, Struktur Organisasi (Departments & Positions),
    serta Manajemen Karyawan / Users (FR-03).
    
    Fitur utama:
    - Multi-tenancy berbasis klaim JWT (`tid`). Seluruh operasi data difilter per tenant.
    - Pembatasan field sensitif (gaji pokok & rekening bank) hanya dapat diakses oleh peran `owner` dan `hrd`.
    - Format error standar RFC 7807 `application/problem+json`.
    - Pagination terstandarisasi dengan objek `meta`.
  version: 1.0.0
  contact:
    name: Tim Pengembang On-Track
    email: dev@ontrack.test

servers:
  - url: http://localhost:4010
    description: Mock Prism (npx @stoplight/prism-cli mock docs/openapi.yaml -p 4010); Prism tidak memakai awalan /v1
  - url: http://localhost:3000/v1
    description: Server Lokal Next.js (Port default / v1 rewrite)
  - url: http://localhost:8080/v1
    description: Server Backend Standalone Lokal
  - url: http://localhost:3000/api/v1
    description: Server Lokal Next.js API direct path

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Otentikasi dan pengelolaan sesi (F01)
  - name: Peran & Hak Akses (F01)
    description: Matriks peran × fitur per tenant (W18)
  - name: Struktur Organisasi - Departments
    description: Pengelolaan divisi / departemen dalam tenant
  - name: Struktur Organisasi - Positions
    description: Pengelolaan jabatan / posisi pekerjaan dalam tenant
  - name: Karyawan (Users - FR-03)
    description: Pengelolaan akun karyawan, profil, aktivasi, dan status kerja
  - name: Data Master - Jadwal (F02)
    description: Pengelolaan jam kerja, toleransi keterlambatan, dan ambang lembur
  - name: Data Master - Lokasi Kantor (F02)
    description: Pengelolaan titik koordinat kantor dan batas radius geofence
  - name: Absensi Harian (F03, F04)
    description: Status hari ini, clock-in validasi GPS dan selfie, serta clock-out
  - name: Lembur & Persetujuan (F04)
    description: Daftar pengajuan lembur, persetujuan, dan penolakan
  - name: Izin dan Cuti (F06)
    description: Kuota tahunan, pengajuan cuti/izin/sakit, dan surat dokter
  - name: Riwayat & Rekapitulasi (F05)
    description: Riwayat bulanan personal, rekapitulasi tenant, dan ekspor PDF
  - name: Persetujuan Izin & Notifikasi (F07)
    description: DRAF - persetujuan izin oleh atasan, sinkron ke kehadiran, dan notifikasi


paths:
  # ==========================================
  # AUTHENTICATION
  # ==========================================
  /auth/login:
    post:
      tags:
        - Auth
      summary: Masuk ke sistem (Login)
      description: |
        Memvalidasi email dan kata sandi. Mengembalikan JWT access token (15 menit)
        dan refresh token (rotasi). Memiliki proteksi lockout setelah 5x gagal.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Berhasil masuk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Kredensial tidak valid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Format email atau kata sandi tidak memenuhi kriteria
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '423':
          description: Akun terkunci karena percobaan gagal berulang
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh Access Token
      description: Menukar refresh token yang valid dengan pasangan access token baru dan refresh token baru (rotasi).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token baru berhasil diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Refresh token tidak valid atau sudah kedaluwarsa
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Keluar dari sistem (Logout)
      description: Mencabut refresh token sesi saat ini.
      responses:
        '200':
          description: Berhasil keluar
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /me:
    get:
      tags:
        - Auth
      summary: Dapatkan profil pengguna saat ini
      description: Mengambil data pengguna login dari klaim token JWT aktif.
      responses:
        '200':
          description: Profil pengguna aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/password/forgot:
    post:
      tags:
        - Auth
      summary: Kirim email tautan reset kata sandi (W19, KW03, M10)
      description: |
        Balasan selalu 202 dengan isi sama, terdaftar atau tidak, agar tidak membocorkan akun.
        Tautan berlaku 30 menit dan sekali pakai. Kirim ulang paling cepat 45 detik sekali → 429 + `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Permintaan diterima; email dikirim bila akun ada
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /auth/password/reset:
    post:
      tags:
        - Auth
      summary: Buat kata sandi baru dari tautan email (W21, KW05, M11)
      description: |
        Kata sandi minimal 8 karakter, berisi huruf dan angka, minimal satu huruf besar.
        Token kedaluwarsa atau sudah dipakai → 410 `RESET_TOKEN_EXPIRED`. Semua refresh token user dicabut.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Kata sandi berhasil diubah (W22, KW06, M25)
        '410':
          description: Tautan reset kedaluwarsa atau sudah dipakai
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'

  /roles/permissions:
    get:
      tags:
        - Peran & Hak Akses (F01)
      summary: Matriks peran × fitur tenant (W18)
      description: 5 peran per tenant; `super_admin` di level platform dan tidak muncul di matriks.
      responses:
        '200':
          description: Matriks hak akses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissions'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    put:
      tags:
        - Peran & Hak Akses (F01)
      summary: Simpan matriks hak akses (W18, W73, W74)
      description: |
        Mengganti seluruh matriks dan mencatatnya di audit log (nilai sebelum dan sesudah).
        Owner tidak boleh mencabut `employees.manage` miliknya → 422 `OWNER_LOCKOUT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissions'
      responses:
        '200':
          description: Matriks tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissions'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ==========================================
  # STRUKTUR ORGANISASI: DEPARTMENTS
  # ==========================================
  /departments:
    get:
      tags:
        - Struktur Organisasi - Departments
      summary: Daftar Departemen / Divisi
      description: Mengambil daftar departemen untuk tenant dari pengguna aktif.
      parameters:
        - name: search
          in: query
          description: Filter pencarian nama departemen
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Nomor halaman
          required: false
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          description: Jumlah item per halaman (maks. 100)
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Daftar departemen
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Department'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Struktur Organisasi - Departments
      summary: Buat Departemen Baru
      description: Menambahkan departemen baru ke tenant. Hanya dapat diakses oleh Admin (Owner / HRD).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
      responses:
        '201':
          description: Departemen berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Departemen dengan nama tersebut sudah ada di tenant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'

  /departments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID Departemen (UUID)
        schema:
          type: string
    get:
      tags:
        - Struktur Organisasi - Departments
      summary: Detail Departemen
      description: Mengambil informasi detail sebuah departemen dalam tenant.
      responses:
        '200':
          description: Detail departemen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags:
        - Struktur Organisasi - Departments
      summary: Perbarui Departemen
      description: Memperbarui data departemen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDepartmentRequest'
      responses:
        '200':
          description: Departemen berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags:
        - Struktur Organisasi - Departments
      summary: Hapus Departemen
      description: Menghapus departemen jika belum ada karyawan atau jabatan yang terhubung.
      responses:
        '200':
          description: Departemen berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: Departemen tidak dapat dihapus karena masih digunakan
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  # ==========================================
  # STRUKTUR ORGANISASI: POSITIONS
  # ==========================================
  /positions:
    get:
      tags:
        - Struktur Organisasi - Positions
      summary: Daftar Jabatan / Posisi
      description: Mengambil daftar jabatan dalam tenant.
      parameters:
        - name: department_id
          in: query
          description: Filter berdasarkan departemen
          required: false
          schema:
            type: string
        - name: search
          in: query
          description: Filter pencarian nama jabatan
          required: false
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Daftar jabatan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Position'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Struktur Organisasi - Positions
      summary: Buat Jabatan Baru
      description: Menambahkan posisi/jabatan baru ke tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePositionRequest'
      responses:
        '201':
          description: Jabatan berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /positions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Struktur Organisasi - Positions
      summary: Detail Jabatan
      responses:
        '200':
          description: Detail jabatan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags:
        - Struktur Organisasi - Positions
      summary: Perbarui Jabatan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePositionRequest'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags:
        - Struktur Organisasi - Positions
      summary: Hapus Jabatan
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ==========================================
  # KARYAWAN / USERS (FR-03)
  # ==========================================
  /users:
    get:
      tags:
        - Karyawan (Users - FR-03)
      summary: Daftar Karyawan / Users
      description: |
        Mengambil daftar karyawan dalam tenant.
        Mendukung filter berdasarkan status (`aktif`, `nonaktif`, `diundang`), divisi/departemen,
        peran, serta pencarian nama atau email.
        
        **Catatan Hak Akses:** Field gaji pokok (`base_salary`) dan data rekening bank
        hanya disertakan apabila pemanggil memiliki peran `owner` atau `hrd`.
      parameters:
        - name: status
          in: query
          description: Filter status karyawan
          schema:
            type: string
            enum: [aktif, nonaktif, diundang]
        - name: department_id
          in: query
          description: Filter berdasarkan ID Departemen
          schema:
            type: string
        - name: role
          in: query
          description: Filter berdasarkan peran
          schema:
            type: string
            enum: [owner, hrd, team_lead, employee, cashier]
        - name: search
          in: query
          description: Pencarian nama atau email
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Daftar data karyawan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResponse'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Karyawan (Users - FR-03)
      summary: Tambah Karyawan Baru (Admin)
      description: |
        Menambahkan data karyawan baru ke dalam tenant.
        Jika `status` tidak ditentukan, default adalah `diundang`.
        Email harus unik dalam lingkup tenant tersebut.
        Hanya Admin (`owner` atau `hrd`) yang berhak memanggil endpoint ini.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Karyawan berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Email sudah terdaftar pada tenant ini
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID Karyawan (UUID / String ID)
        schema:
          type: string
    get:
      tags:
        - Karyawan (Users - FR-03)
      summary: Detail Data Karyawan
      description: |
        Mengambil rincian data karyawan dalam tenant.
        Field sensitif (gaji & rekening bank) hanya terlihat untuk peran `owner` dan `hrd`.
      responses:
        '200':
          description: Detail data karyawan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags:
        - Karyawan (Users - FR-03)
      summary: Perbarui Data Karyawan
      description: |
        Memperbarui data profil, jabatan, jadwal, atau konfigurasi karyawan.
        Hanya Admin (`owner` / `hrd`) yang dapat mengubah data sensitif.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Data berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{id}/deactivate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Karyawan (Users - FR-03)
      summary: Nonaktifkan Karyawan
      description: |
        Menonaktifkan status karyawan. Alasan penonaktifan (`reason`) wajib disertakan
        (maksimal 200 karakter) dan dicatat dalam audit log sistem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateUserRequest'
      responses:
        '200':
          description: Karyawan berhasil dinonaktifkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{id}/reactivate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Karyawan (Users - FR-03)
      summary: Aktifkan Kembali Karyawan
      description: Mengubah kembali status karyawan nonaktif menjadi `aktif`.
      responses:
        '200':
          description: Karyawan berhasil diaktifkan kembali
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /users/{id}/invitation:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Karyawan (Users - FR-03)
      summary: Kirim Ulang Undangan Akun
      description: Mengirimkan kembali email undangan aktivasi bagi karyawan yang berstatus `diundang`.
      responses:
        '200':
          description: Undangan berhasil dikirim ulang
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Email undangan berhasil dikirim ulang ke alamat tujuan.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # Alias endpoints untuk kompatibilitas usulan di PDF
  /employees:
    get:
      tags: [Karyawan (Users - FR-03)]
      deprecated: true
      summary: Alias GET /users
      parameters:
        - $ref: '#/paths/~1users/get/parameters/0'
        - $ref: '#/paths/~1users/get/parameters/1'
        - $ref: '#/paths/~1users/get/parameters/2'
        - $ref: '#/paths/~1users/get/parameters/3'
        - $ref: '#/paths/~1users/get/parameters/4'
        - $ref: '#/paths/~1users/get/parameters/5'
      responses:
        '200':
          $ref: '#/paths/~1users/get/responses/200'
    post:
      tags: [Karyawan (Users - FR-03)]
      deprecated: true
      summary: Alias POST /users
      requestBody:
        $ref: '#/paths/~1users/post/requestBody'
      responses:
        '201':
