  /me/leave-requests:
    get:
      tags:
        - Izin dan Cuti (F06)
      summary: Daftar pengajuan izin/cuti pengguna sendiri (M16, KW17)
      description: Terbaru di atas.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DecisionStatus'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PerPageQuery'
      responses:
        '200':
          description: Daftar pengajuan izin dan cuti
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeaveRequest'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - Izin dan Cuti (F06)
      summary: Ajukan izin, cuti tahunan, atau sakit (M05, KW18)
      description: |
        - Hanya `cuti` yang memotong kuota. Sisa kuota = total − terpakai − menunggu; kurang → 422 `LEAVE_QUOTA_EXCEEDED` (M18, KW20).
        - Hari = hari kerja Senin–Jumat dari `start_date` sampai `end_date`, keduanya dihitung, dikurangi hari libur tenant.
        - `end_date` sebelum `start_date` → 422 `INVALID_DATE_RANGE`; rentang hanya akhir pekan/libur → 422 `NO_WORKING_DAYS`.
        - `sakit` lebih dari 1 hari kerja wajib `attachment` → 422 `DOCTOR_NOTE_REQUIRED`.
        - Lampiran PDF atau JPG maks. 5 MB, diperiksa dari isi file → 422 `INVALID_ATTACHMENT`.
        - Tumpang tindih dengan pengajuan menunggu/disetujui → 422 `OVERLAPPING_LEAVE`.
        - Dikirim ke atasan langsung (`manager_id`); bila kosong ke HRD.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateLeaveRequest'
            encoding:
              attachment:
                contentType: application/pdf, image/jpeg
      responses:
        '201':
          description: Pengajuan berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/leave-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags:
        - Izin dan Cuti (F06)
      summary: Detail pengajuan izin/cuti (M41 "Lihat detail pengajuan")
      responses:
        '200':
          description: Detail pengajuan izin/cuti
          content:
            application/json:
              schema:
