          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /attendance/recap/exports/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      operationId: getAttendanceRecapExport
      tags:
        - Riwayat & Rekapitulasi (F05)
      summary: Cek status pembuatan dan tautan unduhan dokumen PDF (W39, W98)
      responses:
        '200':
          description: Status ekspor PDF dan URL unduhan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JSON Web Token yang memuat klaim:
        - `sub`: User ID
        - `tid`: Tenant ID
        - `role`: Peran pengguna (`super_admin`, `owner`, `hrd`, `team_lead`, `employee`, `cashier`)
        - `eid`: Employee ID
        - `mods`: Modul aktif tenant, misalnya `["attendance", "leave", "payroll"]`

  responses:
    UnauthorizedError:
      description: Autentikasi gagal atau token tidak disertakan
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ForbiddenError:
      description: Tidak memiliki hak akses untuk tindakan ini
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFoundError:
      description: Data tidak ditemukan pada tenant ini
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationError:
      description: Data input tidak valid (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ConflictError:
      description: Konflik status, misalnya sudah clock-in hari ini atau pengajuan sudah diputuskan
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequestsError:
      description: Terlalu banyak permintaan; tunggu sesuai header Retry-After
      headers:
        Retry-After:
          description: Detik sebelum boleh mencoba lagi
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  parameters:
    PageQuery:
      name: page
      in: query
      description: Nomor halaman, mulai dari 1
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageQuery:
      name: per_page
      in: query
      description: Jumlah item per halaman (maks. 100)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    MonthQuery:
      name: month
      in: query
      description: Bulan dalam format YYYY-MM; default bulan berjalan di zona waktu tenant
      required: false
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        example: '2026-09'
    PeriodPath:
      name: period
      in: path
      required: true
      description: Periode payroll YYYY-MM
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        example: '2026-10'
    DepartmentQuery:
      name: department_id
      in: query
      description: Filter divisi/departemen; kosong = semua divisi
      required: false
      schema:
        type: string

  schemas:
    # ------------------------------------------
    # RFC 7807 PROBLEM DETAILS
    # ------------------------------------------
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          example: https://ontrack.app/problems/validation-error
        title:
          type: string
          example: Data yang dimasukkan tidak valid
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: Format email atau field wajib belum diisi dengan benar.
        code:
          type: string
          example: VALIDATION_ERROR
        errors:
          type: object
          additionalProperties:
            type: string
          example:
            email: Format email tidak valid
            name: Nama wajib diisi

    PaginationMeta:
      type: object
      required:
        - page
        - per_page
        - total
        - total_pages
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 6
        total_pages:
          type: integer
          example: 1

    # ------------------------------------------
    # AUTH SCHEMAS
    # ------------------------------------------
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: daze@studiotigapagi.com
        password:
          type: string
          format: password
          example: Demo1234
        remember_me:
          type: boolean
          default: false

    AuthTokens:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          example: eyJhbGciOi...
        refresh_token:
          type: string
          example: def502...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Masa berlaku access token dalam detik (900 detik / 15 menit)
          example: 900

    LoginResponse:
      type: object
      required:
        - tokens
        - user
      properties:
        tokens:
          $ref: '#/components/schemas/AuthTokens'
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      required:
        - id
        - tenant_id
        - name
        - email
        - role
      properties:
        id:
          type: string
          example: daze
        tenant_id:
          type: string
          example: tenant-studiotigapagi
        name:
          type: string
          example: Dhais Alfa Rysy
        email:
          type: string
          example: daze@studiotigapagi.com
        role:
          type: string
          enum: [super_admin, owner, hrd, team_lead, employee, cashier]
          example: employee
        department:
          type: string
          example: Design
        position:
          type: string
          example: Lead Graphic Designer

    # ------------------------------------------
    # DEPARTMENTS SCHEMAS
    # ------------------------------------------
    Department:
      type: object
      required:
        - id
        - tenant_id
        - name
        - created_at
      properties:
        id:
          type: string
          example: dept-design
        tenant_id:
          type: string
          example: tenant-studiotigapagi
        name:
          type: string
          example: Design
        description:
          type: string
          nullable: true
          example: Divisi desain grafis, produk, dan UI/UX
        employee_count:
          type: integer
          example: 3
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateDepartmentRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Marketing
        description:
          type: string
          maxLength: 255
          example: Tim pemasaran dan media sosial

    UpdateDepartmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 255

    # ------------------------------------------
    # POSITIONS SCHEMAS
    # ------------------------------------------
    Position:
      type: object
      required:
        - id
        - tenant_id
        - name
        - created_at
      properties:
        id:
          type: string
          example: pos-lead-designer
        tenant_id:
          type: string
          example: tenant-studiotigapagi
        department_id:
          type: string
          nullable: true
          example: dept-design
        department_name:
          type: string
          nullable: true
          example: Design
        name:
          type: string
          example: Lead Graphic Designer
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePositionRequest:
      type: object
      required:
        - name
      properties:
        department_id:
          type: string
          nullable: true
          example: dept-design
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Senior UI Designer
        description:
          type: string
          maxLength: 255

    UpdatePositionRequest:
      type: object
      properties:
        department_id:
          type: string
          nullable: true
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 255

    # ------------------------------------------
    # USERS / EMPLOYEES SCHEMAS (FR-03)
    # ------------------------------------------
    UserResponse:
      type: object
      required:
        - id
        - tenant_id
        - name
        - email
        - role
        - employment_type
        - status
        - created_at
      properties:
        id:
          type: string
          example: daze
        tenant_id:
          type: string
          example: tenant-studiotigapagi
        name:
          type: string
          example: Dhais Alfa Rysy
        email:
          type: string
          example: daze@studiotigapagi.com
        phone:
          type: string
          nullable: true
          example: 0857 3900 1122
        department_id:
          type: string
          nullable: true
          example: dept-design
        department_name:
          type: string
          nullable: true
          example: Design
        position_id:
          type: string
          nullable: true
          example: pos-lead-designer
        position_name:
          type: string
          nullable: true
          example: Lead Graphic Designer
        role:
          type: string
          enum: [owner, hrd, team_lead, employee, cashier]
          example: employee
        employment_type:
          type: string
          enum: [tetap, kontrak, magang]
          example: tetap
        status:
          type: string
          enum: [aktif, nonaktif, diundang]
          example: aktif
        joined_at:
          type: string
          format: date
          example: "2024-03-12"
        manager_id:
          type: string
          nullable: true
          example: ananda
        manager_name:
          type: string
          nullable: true
          example: Ananda Sartana
        schedule_id:
          type: string
          nullable: true
          example: sched-reguler
        schedule_name:
          type: string
          nullable: true
          example: Reguler · 09.00–17.00
        location_id:
          type: string
          nullable: true
          example: loc-sanur
        location_name:
          type: string
          nullable: true
          example: Kantor Sanur
        allow_wfh_without_approval:
          type: boolean
          default: false
          example: false
        # SENSITIVE DATA (HANYA MUNCUL UNTUK OWNER & HRD):
        base_salary:
          type: string
          nullable: true
          description: Gaji pokok berupa string desimal (Hanya terlihat oleh Owner & HRD).
          example: "7250000.00"
        bank_name:
          type: string
          nullable: true
          description: Nama bank (Hanya terlihat oleh Owner & HRD).
          example: BCA
        bank_account_number:
          type: string
          nullable: true
          description: Nomor rekening bank (Hanya terlihat oleh Owner & HRD).
          example: "0123454821"
        bank_account_holder:
          type: string
          nullable: true
          description: Nama pemilik rekening (Hanya terlihat oleh Owner & HRD).
          example: Dhais Alfa Rysy
        # DATA PENONAKTIFAN:
        inactive_since:
          type: string
          format: date
          nullable: true
          example: "2026-10-01"
        deactivation_reason:
          type: string
          nullable: true
          maxLength: 200
          example: Mengundurkan diri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required:
        - name
        - email
        - role
        - employment_type
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Putu Ayu Lestari
        email:
          type: string
          format: email
          example: ayu@studiotigapagi.com
        phone:
          type: string
          example: 0812 3456 7890
        department_id:
          type: string
          example: dept-design
        position_id:
          type: string
          example: pos-ui-designer
        role:
          type: string
          enum: [owner, hrd, team_lead, employee, cashier]
          default: employee
        employment_type:
          type: string
          enum: [tetap, kontrak, magang]
          default: kontrak
        status:
          type: string
          enum: [aktif, diundang]
          default: diundang
        joined_at:
          type: string
          format: date
          example: "2026-11-01"
        manager_id:
          type: string
          example: daze
        schedule_id:
          type: string
          example: sched-reguler
        location_id:
          type: string
          example: loc-sanur
        allow_wfh_without_approval:
          type: boolean
          default: false
        base_salary:
          type: string
          pattern: '^\d+(\.\d{2})?$'
          example: "6500000.00"
        bank_name:
          type: string
          example: BCA
        bank_account_number:
          type: string
          example: "0987654321"
        bank_account_holder:
          type: string
          example: Putu Ayu Lestari

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
        department_id:
          type: string
          nullable: true
        position_id:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, hrd, team_lead, employee, cashier]
        employment_type:
          type: string
          enum: [tetap, kontrak, magang]
        joined_at:
          type: string
          format: date
        manager_id:
          type: string
          nullable: true
        schedule_id:
          type: string
          nullable: true
        location_id:
          type: string
          nullable: true
        allow_wfh_without_approval:
          type: boolean
        base_salary:
          type: string
          pattern: '^\d+(\.\d{2})?$'
        bank_name:
          type: string
        bank_account_number:
          type: string
        bank_account_holder:
          type: string

    DeactivateUserRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 200
          description: Alasan wajib penonaktifan karyawan (maks. 200 karakter)
          example: Masa kontrak berakhir dan tidak diperpanjang.

    # ------------------------------------------
    # AUTH & PERAN (F01)
    # ------------------------------------------
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: daze@studiotigapagi.com

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: Token dari tautan email
        password:
          type: string
          format: password
          minLength: 8
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$'
          description: Minimal 8 karakter, huruf dan angka, minimal satu huruf besar

    TenantRole:
      type: string
      description: Peran yang diatur per tenant (W18). `super_admin` tidak termasuk.
      enum: [owner, hrd, team_lead, employee, cashier]

    PermissionFeature:
      type: string
      description: Kunci fitur matriks W18, urut sesuai tampilan.
      enum:
        - employees.manage
        - attendance.self
        - leave.request
        - leave.approve
        - task.assign
        - task.update
        - payroll.manage
        - payslip.self
        - pos.transaction
        - inventory.manage

    RolePermissions:
      type: object
      required: [features]
      properties:
        features:
          type: array
          items:
            type: object
            required: [key, allowed]
            properties:
              key:
                $ref: '#/components/schemas/PermissionFeature'
              label:
                type: string
                readOnly: true
                example: Kelola karyawan & pengaturan
              allowed:
                type: array
                description: Peran yang boleh memakai fitur ini
                items:
                  $ref: '#/components/schemas/TenantRole'
                example: [owner, hrd]
        updated_at:
          type: string
          format: date-time
          readOnly: true

    UserSettings:
      type: object
      properties:
        push_notifications:
          type: boolean
          example: true

    RegisterDeviceRequest:
      type: object
      required: [push_token, platform]
      properties:
        push_token:
          type: string
          description: Expo push token
          example: ExponentPushToken[xxxxxxxxxxxxxxxx]
        platform:
          type: string
          enum: [ios, android]
        model:
          type: string
          example: iPhone 15 Pro
        os_version:
          type: string
          example: iOS 17.4

    # ------------------------------------------
    # JADWAL & LOKASI (F02)
    # ------------------------------------------
    WorkDay:
      type: string
      enum: [sen, sel, rab, kam, jum, sab, min]

    Schedule:
      type: object
      required:
        - id
        - name
        - start_time
        - end_time
        - tolerance_minutes
        - working_days
        - overtime_after_minutes
        - max_overtime_minutes
        - allow_remote
      properties:
        id:
          type: string
          example: reguler
        name:
          type: string
          example: Reguler
        start_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '09:00'
        end_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '17:00'
        tolerance_minutes:
          type: integer
          example: 10
        working_days:
          type: array
          items:
            $ref: '#/components/schemas/WorkDay'
          example: [sen, sel, rab, kam, jum]
        overtime_after_minutes:
          type: integer
          example: 30
        max_overtime_minutes:
          type: integer
          example: 180
        allow_remote:
          type: boolean
          example: true
        member_count:
          type: integer
          readOnly: true
          example: 8

    CreateScheduleRequest:
      type: object
      required: [name, start_time, end_time, working_days]
      properties:
        name:
          type: string
          example: Reguler
        start_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '09:00'
        end_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '17:00'
        tolerance_minutes:
          type: integer
          minimum: 0
          default: 10
        working_days:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkDay'
          example: [sen, sel, rab, kam, jum]
        overtime_after_minutes:
          type: integer
          minimum: 0
          default: 30
        max_overtime_minutes:
          type: integer
          minimum: 0
          default: 180
        allow_remote:
          type: boolean
          default: true

    UpdateScheduleRequest:
      type: object
      properties:
        name:
          type: string
        start_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        end_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        tolerance_minutes:
          type: integer
          minimum: 0
        working_days:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkDay'
        overtime_after_minutes:
          type: integer
          minimum: 0
        max_overtime_minutes:
          type: integer
          minimum: 0
        allow_remote:
          type: boolean

    Location:
      type: object
      required: [id, name, address, latitude, longitude, radius_meters, selfie_required]
      properties:
        id:
          type: string
          example: sanur
        name:
          type: string
          example: Kantor Sanur
        address:
          type: string
          example: Jl. Danau Tamblingan No. 226, Sanur
        latitude:
          type: number
          format: double
          example: -8.6923
        longitude:
          type: number
          format: double
          example: 115.2621
        radius_meters:
          type: integer
          minimum: 25
          maximum: 500
          example: 100
        selfie_required:
          type: boolean
          example: true
        member_count:
          type: integer
          readOnly: true
          example: 16

    CreateLocationRequest:
      type: object
      required: [name, address, latitude, longitude, radius_meters]
      properties:
        name:
          type: string
          example: Kantor Sanur
        address:
          type: string
          example: Jl. Danau Tamblingan No. 226, Sanur
        latitude:
          type: number
          format: double
          example: -8.6923
        longitude:
          type: number
          format: double
          example: 115.2621
        radius_meters:
          type: integer
          minimum: 25
          maximum: 500
          example: 100
        selfie_required:
          type: boolean
          default: true

    UpdateLocationRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        radius_meters:
          type: integer
          minimum: 25
          maximum: 500
        selfie_required:
          type: boolean

    ScheduleLocation:
      type: object
      required: [schedule, location, timezone, wfh_without_approval]
      properties:
        schedule:
          $ref: '#/components/schemas/Schedule'
        location:
          $ref: '#/components/schemas/Location'
        timezone:
          type: string
          description: Zona waktu IANA tenant
          example: Asia/Makassar
        wfh_without_approval:
          type: boolean
          description: Bila true, clock-in tidak dicek radius
          example: false

    # ------------------------------------------
    # ABSENSI HARIAN (F03, F04)
    # ------------------------------------------
    EmployeeRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: daze
        name:
          type: string
          example: Dhais Alfa Rysy
        initials:
          type: string
          example: DA
        position:
          type: string
          example: Lead Graphic Designer
        department_id:
          type: string
          example: design
        department_name:
          type: string
          example: Design

    ClockInStatus:
      type: string
      enum: [hadir, terlambat]

    ClockInRequest:
      type: object
      required: [latitude, longitude, accuracy_m]
      properties:
        latitude:
          type: number
          format: double
          example: -8.6923
        longitude:
          type: number
          format: double
          example: 115.2621
        accuracy_m:
          type: number
          example: 15.4
        device:
          type: string
          description: Model dan OS perangkat
          example: iPhone 15 Pro, iOS 17.4
        is_mock_location:
          type: boolean
          default: false
        selfie:
          type: string
          format: binary
          description: Foto JPEG. Wajib bila lokasi kantor `selfie_required`.

    ClockInResult:
      type: object
      required: [attendance_id, status, late_minutes, clocked_in_at, distance_m, accuracy_m, location_name]
      properties:
        attendance_id:
          type: string
        status:
          $ref: '#/components/schemas/ClockInStatus'
        late_minutes:
          type: integer
          description: 0 bila hadir tepat waktu
          example: 0
        clocked_in_at:
          type: string
          format: date-time
          example: '2026-10-01T00:52:00Z'
        distance_m:
          type: number
          example: 42
        accuracy_m:
          type: number
          example: 8
        location_name:
