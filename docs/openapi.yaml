  # ==========================================
  # ABSENSI HARIAN (F03, F04)
  # ==========================================
  /attendance/today:
    get:
      tags:
        - Absensi Harian (F03, F04)
      summary: Status absensi hari ini pengguna saat ini
      description: |
        Mengembalikan status hari ini, jadwal, lokasi kantor, dan ringkasan bulan berjalan
        (M02, M08, M49, KW08). "Hari ini" dihitung di zona waktu tenant, bukan UTC.
      responses:
        '200':
          description: Status absensi hari ini berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceToday'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /attendance/clock-in:
    post:
      tags:
        - Absensi Harian (F03, F04)
      summary: Clock-in kehadiran masuk kerja
      description: |
        Server mencatat jam sendiri dan menilai ulang lokasi; nilai dari perangkat hanya masukan.
        - Akurasi GPS lebih buruk dari ±50 m → 422 `GPS_WEAK` (M29).
        - Mock location → 422 `MOCK_LOCATION_DETECTED`.
        - Jarak haversine ke titik kantor di luar radius → 422 `OUTSIDE_GEOFENCE` dengan `distance_m` dan `radius_m` (M07, KW13).
          Dilewati bila karyawan punya `wfh_without_approval` atau WFH/Dinas Luar yang disetujui hari itu.
        - Selfie wajib bila lokasi `selfie_required`; tanpa wajah → 422 `FACE_NOT_DETECTED` (M30).
        - Status `hadir` bila masuk ≤ jam masuk + toleransi; selain itu `terlambat`, dihitung dari jam masuk
          (09:14 dengan toleransi 10 menit = terlambat 14 menit).
        - Hanya 1 clock-in per hari kerja → 409 `ALREADY_CLOCKED_IN`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClockInRequest'
            encoding:
              selfie:
                contentType: image/jpeg
      responses:
        '201':
          description: Clock-in berhasil dicatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClockInResult'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          description: GPS lemah, di luar radius, lokasi palsu, atau wajah tidak terdeteksi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GeofenceProblem'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /attendance/clock-out:
    post:
      tags:
        - Absensi Harian (F03, F04)
      summary: Clock-out kehadiran pulang kerja
      description: |
        - Pulang sebelum jam pulang jadwal: `early_leave_note` wajib, maks. 200 karakter (M34, KW26).
        - Clock-out lebih dari `overtime_after_minutes` (default 30) setelah jam pulang membuat pengajuan lembur.
          Lembur dihitung dari jam pulang (17:00 → 17:44 = 44 menit), dibatasi `max_overtime_minutes` (default 180),
          dan tidak melebihi jam kerja bila clock-in setelah jam pulang.
        - Di luar radius → 422 `OUTSIDE_GEOFENCE`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockOutRequest'
      responses:
        '200':
          description: Clock-out berhasil dicatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClockOutResult'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          description: Belum clock-in, catatan pulang cepat kosong, GPS lemah, atau di luar radius
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GeofenceProblem'

