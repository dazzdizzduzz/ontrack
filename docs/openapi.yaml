      summary: Pratinjau perhitungan hari kerja dan cek kuota sebelum kirim
      description: Tidak menyimpan apa pun. Dipakai untuk teks "3 hari kerja" dan peringatan kuota sebelum tombol Ajukan.
      requestBody:
