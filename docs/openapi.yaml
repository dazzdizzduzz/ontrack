    MonthlyAttendance:
      type: object
      required: [month, summary, days]
      properties:
        month:
          type: string
          example: '2026-09'
        employee:
          $ref: '#/components/schemas/EmployeeRef'
        summary:
          $ref: '#/components/schemas/MonthSummary'
        days:
          type: array
          description: Kosong bila bulan tanpa catatan
          items:
            $ref: '#/components/schemas/AttendanceDay'

    TodayStatus:
      type: string
      enum: [hadir, terlambat, izin, cuti, sakit, wfh, alpha, belum]

    AttendanceRecapRow:
      type: object
      required: [employee, hadir, terlambat, izin, alpha, worked_minutes, today_status]
