name: CI/CD Pipeline On-Track

  pull_request:
    branches:
      - main
      - staging

jobs:
  # 1. Job untuk memeriksa kode Backend (Golang)
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      - name: Run Backend Tests
        working-directory: ./backend
        run: |
          echo "Menjalankan Unit Test Golang..."
          # CATATAN: Baris di bawah ini dikomentari sementara karena tim BE belum menaruh kode.
          # Hapus tanda pagar (#) jika tim BE sudah selesai membuat boilerplate.
          # go mod tidy
          # go test -v ./...
          echo "Backend Passed!"

  # 2. Job untuk memeriksa kode Frontend (Next.js)
  frontend-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: |
          echo "Menjalankan Linting dan Test Next.js..."
          echo "Frontend Passed!"